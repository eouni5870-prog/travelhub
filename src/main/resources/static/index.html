<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelHub - Mes destinations</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
    <div class="container">
        <h1>✈️ TravelHub</h1>
        <p>Gérez vos destinations de voyage et consultez la météo en temps réel</p>
    </div>
</header>

<main class="container">
    <!-- Statistiques -->
    <section class="stats">
        <div class="stat"><span id="stat-total">0</span><small>Destinations</small></div>
        <div class="stat"><span id="stat-planned">0</span><small>Planifiées</small></div>
        <div class="stat"><span id="stat-visited">0</span><small>Visitées</small></div>
        <div class="stat"><span id="stat-budget">0 DT</span><small>Budget total</small></div>
    </section>

    <!-- Barre d'outils -->
    <section class="toolbar">
        <input type="text" id="search" placeholder="🔍 Rechercher une ville ou un pays...">
        <select id="filter">
            <option value="">Toutes</option>
            <option value="PLANNED">Planifiées</option>
            <option value="VISITED">Visitées</option>
        </select>
        <button class="btn primary" id="btn-add">+ Nouvelle destination</button>
    </section>

    <!-- Météo rapide (API externe) -->
    <section class="quick-weather">
        <h2>🌍 Météo d'une ville</h2>
        <form id="weather-form">
            <input type="text" id="weather-city" placeholder="Ex : Tunis, Milan, Tokyo..." required>
            <button class="btn" type="submit">Voir la météo</button>
        </form>
        <div id="weather-result"></div>
    </section>

    <!-- Liste -->
    <section id="list" class="grid"></section>
</main>

<!-- Fenêtre ajout / modification -->
<div class="modal" id="modal">
    <form class="modal-box" id="dest-form">
        <h2 id="modal-title">Nouvelle destination</h2>
        <input type="hidden" id="dest-id">
        <div class="row">
            <label>Ville *<input type="text" id="city" required></label>
            <label>Pays *<input type="text" id="country" required></label>
        </div>
        <label>Description<textarea id="description" rows="3"></textarea></label>
        <div class="row">
            <label>Budget (DT)<input type="number" id="budget" min="0" step="10"></label>
            <label>Date prévue<input type="date" id="plannedDate"></label>
        </div>
        <label>Statut
            <select id="status">
                <option value="PLANNED">Planifiée</option>
                <option value="VISITED">Visitée</option>
            </select>
        </label>
        <div class="actions">
            <button type="button" class="btn" id="btn-cancel">Annuler</button>
            <button type="submit" class="btn primary">Enregistrer</button>
        </div>
    </form>
</div>

<!-- Fenêtre météo -->
<div class="modal" id="weather-modal">
    <div class="modal-box">
        <div id="weather-modal-content"></div>
        <div class="actions"><button class="btn" id="btn-close-weather">Fermer</button></div>
    </div>
</div>

<div id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
