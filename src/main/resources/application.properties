spring.application.name=travelhub
server.port=8080

# Base de donnees H2 (fichier local, les donnees restent apres redemarrage)
spring.datasource.url=jdbc:h2:mem:travelhub
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console H2 : http://localhost:8080/h2-console
spring.h2.console.enabled=true

# API externe gratuite (sans cle) : Open-Meteo
external.geocoding.url=https://geocoding-api.open-meteo.com/v1/search
external.weather.url=https://api.open-meteo.com/v1/forecast
